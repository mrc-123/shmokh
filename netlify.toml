[build]
  command = "npm run build"
  publish = "out"

# Preserve true 404 responses; no SPA fallback to index.html.
[[headers]]
  for = "/404.html"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=UTF-8"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=UTF-8"
